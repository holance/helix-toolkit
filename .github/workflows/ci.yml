name: CI

on:
  push:
    branches:
      - main*
      - develop*
      - release*
  pull_request:
    branches:
      - main*
      - develop*

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        dotnet-version: ['4.8.x', '6.0.x', '8.0.x'] # Add the .NET versions you want to test

    steps:
    - name: Set up .NET ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
    - name: Checkout repository
      uses: actions/checkout@v2        

    - name: Install GitVersion
      run: choco install gitversion.portable --version=5.12.0 -y

    - name: Restore NuGet packages
      run: nuget restore .\Source\HelixToolkit.sln

    - name: Run GitVersion
      run: gitversion /l console /output buildserver /updateprojectfiles

    - name: Build solution
      run: dotnet build .\Source\HelixToolkit.sln --configuration Release --no-restore

    - name: Run tests
      run: .\Source\run-tests.cmd

    - name: Publish to NuGet
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: nuget push .\Source\**\*.nupkg -Source https://www.myget.org/F/helixtoolkit-nightly/api/v2/package -ApiKey ${{ secrets.NUGET_API_KEY }}
