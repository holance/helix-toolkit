name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 6.0.x

    - name: Install GitVersion
      run: choco install gitversion.portable --version=5.12.0 -y

    - name: Restore NuGet packages
      run: nuget restore .\Source\HelixToolkit.sln

    - name: Run GitVersion
      run: gitversion /l console /output buildserver /updateprojectfiles

    - name: Build solution
      run: dotnet build .\Source\HelixToolkit.sln --configuration Release --no-restore

    - name: Run tests
      run: .\Source\run-tests.cmd

    - name: Publish to NuGet
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: nuget push .\Source\**\*.nupkg -Source https://www.myget.org/F/helixtoolkit-nightly/api/v2/package -ApiKey ${{ secrets.NUGET_API_KEY }}
